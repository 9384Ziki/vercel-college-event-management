services:
  mysql:
    image: mysql:8.4
    container_name: college-event-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [event-net]

  backend:
    build: ./backend
    container_name: college-event-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:5000"
    networks: [event-net]

  frontend:
    build: ./frontend
    container_name: college-event-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT}:80"
    networks: [event-net]

volumes:
  mysql_data:

networks:
  event-net:
    driver: bridge
