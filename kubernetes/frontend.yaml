apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: college-events
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: college-event-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: college-events
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
